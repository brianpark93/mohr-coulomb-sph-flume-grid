<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mohr&ndash;Coulomb SPH flume deposits &mdash; parameter explorer</title>
<!-- Deliberately pure ASCII, with HTML entities for every symbol. This file
     lives on a Windows machine where a stray PowerShell rewrite once replaced
     every non-ASCII character with a question mark; entities cannot be
     corrupted that way. -->
<style>
  :root{
    --ink:#23211d; --muted:#6f6c66; --line:#d9d6cd; --grid:#ebe8e0;
    --bg:#faf8f4; --panel:#fff; --sand:#c9a08a; --steel:#898781;
    --deep:#1b3a6b; --warn:#a3231b; --context:#bdb5a6; --pred:#2a78d6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .page{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:26px;margin:0 0 4px;font-weight:650;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:16px;margin:0 0 18px}
  .sub a{color:var(--deep)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .stage{padding:14px 16px 6px;margin-bottom:18px}
  canvas{width:100%;display:block}
  .layout{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}
  @media (max-width:860px){.layout{grid-template-columns:1fr}}
  .pad{padding:16px 18px}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;
     color:var(--muted);margin:0 0 14px;font-weight:600}
  .row{margin-bottom:16px}
  .row:last-child{margin-bottom:4px}
  .lab{display:flex;justify-content:space-between;align-items:baseline;
       margin-bottom:5px}
  .sym{font-weight:600}
  .sym small{font-weight:400;color:var(--muted);margin-left:6px}
  .val{font-variant-numeric:tabular-nums;color:var(--deep);font-weight:600}
  input[type=range]{width:100%;accent-color:var(--deep);margin:0}
  .ticks{display:flex;justify-content:space-between;
         color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px;
         font-size:12px}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  td{padding:7px 0;border-bottom:1px solid var(--grid);font-size:16px}
  td:last-child{text-align:right;font-weight:600}
  td.cmp{text-align:right;font-weight:400;color:var(--muted);width:4.2em}
  td.par{white-space:nowrap;width:1%}
  tr:last-child td{border-bottom:none}
  .flag{margin-top:16px;padding:12px 14px;border-radius:7px;font-size:15px;
        line-height:1.5;display:none}
  .flag.on{display:block;background:#fdf0ee;border:1px solid #f0cdc7;
           color:var(--warn)}
  .btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  button{font:inherit;font-size:15px;padding:9px 14px;border-radius:7px;
         border:1px solid var(--line);background:#fff;color:var(--ink);
         cursor:pointer}
  button:hover{border-color:var(--muted)}
  button.active{background:var(--deep);border-color:var(--deep);color:#fff}
  .modes{display:flex;gap:0;margin:0 0 18px;border:1px solid var(--line);
         border-radius:8px;overflow:hidden;width:fit-content}
  .modes button{border:0;border-radius:0;padding:10px 18px;font-size:15.5px}
  .modes button+button{border-left:1px solid var(--line)}
  .track{position:relative;height:16px;border-radius:4px;background:var(--grid);
         width:100%;min-width:100px}
  .span{position:absolute;top:0;height:16px;border-radius:4px;
        background:rgba(42,120,214,.30)}
  .tick{position:absolute;top:-2px;width:2px;height:20px;margin-left:-1px}
  .tick.mid{background:var(--pred)}
  .tick.tru{background:var(--ink)}
  td .track{margin:2px 0}
  td.leg{color:var(--muted);font-size:13px;font-weight:400;
         text-align:left;padding-top:10px;line-height:1.5}
  .note{color:var(--muted);font-size:14.5px;line-height:1.55;margin-top:14px}
  .key{font-size:17px;line-height:1}
  .load{padding:50px 20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="page">
  <h1>Mohr&ndash;Coulomb SPH flume deposits</h1>
  <p class="sub">Move a slider and watch the deposit change.
    <a href="https://github.com/brianpark93/mohr-coulomb-sph-flume-grid">data and
    documentation</a></p>

  <div id="boot" class="card load">loading&hellip;</div>

  <div id="app" style="display:none">
    <div class="modes">
      <button id="mode-grid" class="active">Solved grid</button>
      <button id="mode-pred">Emulator prediction</button>
      <button id="mode-inv">Inverse</button>
    </div>
    <p class="sub" id="modetext"></p>

    <div class="card stage"><canvas id="cv"></canvas></div>
    <div class="layout">
      <div class="card pad">
        <h2>Parameters</h2>
        <div id="sliders"></div>
        <div class="btns">
          <button id="pin">Pin this shape to compare</button>
          <button id="env" class="active">Envelope</button>
          <button id="sketch">Draw a deposit</button>
          <button id="clearsketch">Clear drawing</button>
          <button id="reset">Reset</button>
        </div>
        <p class="note" id="slidernote"></p>
      </div>
      <div class="card pad">
        <h2 id="rohead">This deposit</h2>
        <table id="ro"></table>
        <p class="note" id="keynote"></p>
        <div id="flag" class="flag"></div>
      </div>
    </div>
  </div>
</div>

<script>
const AX = {x0:-0.16, x1:2.06, z0:-0.06, z1:0.46};   // metres, fixed everywhere
const KEYS = [
  {k:"gmod_mpa", f:"gmod_pa", sym:"G",      name:"shear modulus",  short:"stiffness", unit:"MPa", dp:2, log:true},
  {k:"phi_rad",  f:"phi_rad", sym:"\u03c6", name:"friction angle", short:"friction",  unit:"rad", dp:3},
  {k:"psi_rad",  f:"psi_rad", sym:"\u03c8", name:"dilation angle", short:"dilation",  unit:"rad", dp:3},
  {k:"cval_pa",  f:"cval_pa", sym:"c",      name:"cohesion",       short:"cohesion",  unit:"Pa",  dp:0},
];
const NSTEP = 240;                    // slider resolution in prediction mode

let D, P, N, S, XT, AL;               // grid data; surrogate header + weights
let IF, IFA;                          // inverse forests: header, packed trees
let sketch = null, sketching = false; // a hand-drawn deposit, if any
let mode = "grid";
let sel = [3,3,3,3];                  // grid mode: level indices
let cont = [0.5,0.5,0.5,0.5];         // prediction mode: 0..1 along each range
let pinned = null, showEnv = true;

const $ = id => document.getElementById(id);
const idx = s => ((s[0]*N + s[1])*N + s[2])*N + s[3];
const clamp01 = t => t < 0 ? 0 : t > 1 ? 1 : t;

// ---------------------------------------------------------------- boot
async function boot(){
  try{
    const [j, b] = await Promise.all([
      fetch("grid7.json").then(r=>{if(!r.ok)throw 0; return r.json()}),
      fetch("particles.bin").then(r=>{if(!r.ok)throw 0; return r.arrayBuffer()})
    ]);
    D = j; N = j.n_levels; P = new Int16Array(b);
  }catch(e){
    $("boot").textContent = "Could not load the dataset. If you opened this "
      + "file straight from disk, serve the folder over HTTP instead: "
      + "browsers block fetch from file:// URLs.";
    return;
  }
  // the emulator is optional: if its two files are absent the page still works
  try{
    const [h, w] = await Promise.all([
      fetch("surrogate.json").then(r=>{if(!r.ok)throw 0; return r.json()}),
      fetch("surrogate.bin").then(r=>{if(!r.ok)throw 0; return r.arrayBuffer()})
    ]);
    S = h;
    // float64 throughout: the fitted noise sits at its lower bound, so the
    // kernel matrix is near-singular and alpha is large with heavy
    // cancellation. float32 lost 3.5e-4 of the output spread on the leading
    // shape mode -- harmless in millimetres, but it masks real mismatches.
    const all = new Float64Array(w);
    XT = all.subarray(0, S.n_train*S.n_feat);
    AL = all.subarray(S.n_train*S.n_feat);
  }catch(e){ S = null; $("mode-pred").style.display = "none"; }
  // the inverse regressor is optional in the same way
  try{
    const [h, w] = await Promise.all([
      fetch("invforest.json").then(r=>{if(!r.ok)throw 0; return r.json()}),
      fetch("invforest.bin").then(r=>{if(!r.ok)throw 0; return r.arrayBuffer()})
    ]);
    IF = h;
    const TYPE = {"|u1":Uint8Array, "<u2":Uint16Array,
                  "<u4":Uint32Array, "<f4":Float32Array};
    IFA = {};
    for(const tag of ["shape","coh"]){
      const a = {};
      for(const nm of Object.keys(h.layout[tag])){
        const sp = h.layout[tag][nm];
        a[nm] = new TYPE[sp.dtype](w, sp.offset,
                                   sp.shape.reduce((p,q)=>p*q, 1));
      }
      a.nout = h.layout[tag].value.shape[1];
      // where each tree's leaves begin. Counted once here rather than on
      // every prediction, which would make the walk O(nodes) instead of
      // O(depth) and there are forty thousand nodes.
      a.leafBase = new Uint32Array(a.offset.length);
      let base = 0;
      for(let k=0;k<a.offset.length;k++){
        a.leafBase[k] = base;
        const o = a.offset[k], n = a.count[k];
        for(let j=0;j<n;j++) if(a.feat[o+j] === 255) base++;
      }
      IFA[tag] = a;
    }
  }catch(e){ IF = null; $("mode-inv").style.display = "none"; }

  $("boot").style.display="none"; $("app").style.display="";
  $("mode-grid").onclick = () => setMode("grid");
  $("mode-pred").onclick = () => setMode("pred");
  $("mode-inv").onclick = () => setMode("inv");
  $("pin").onclick = () => {
    pinned = pinned ? null : (mode==="grid" ? sel.slice() : null);
    $("pin").classList.toggle("active", !!pinned);
    $("pin").textContent = pinned ? "Unpin" : "Pin this shape to compare";
    draw();
  };
  $("env").onclick = () => {
    showEnv = !showEnv; $("env").classList.toggle("active", showEnv); draw();
  };
  $("reset").onclick = () => {
    sel=[3,3,3,3]; cont=[0.5,0.5,0.5,0.5]; pinned=null; sketch=null;
    $("pin").classList.remove("active");
    $("pin").textContent = "Pin this shape to compare";
    setMode(mode);     // re-applies the mode's own defaults, drawing included
  };
  $("sketch").onclick = () => {
    sketching = !sketching;
    $("sketch").classList.toggle("active", sketching);
    if(sketching && mode!=="inv") setMode("inv"); else draw();
  };
  $("clearsketch").onclick = () => { sketch = null; draw(); };
  const cv = $("cv");
  const paintAt = ev => { if(!sketching || mode!=="inv") return;
                          ev.preventDefault(); sketchFromEvent(ev); draw(); };
  cv.addEventListener("pointerdown", ev => {
    if(!sketching || mode!=="inv") return;
    if(sketch) sketch._last = null;
    cv.setPointerCapture && cv.setPointerCapture(ev.pointerId);
    paintAt(ev);
  });
  cv.addEventListener("pointermove", ev => {
    if(ev.buttons) paintAt(ev);
  });
  cv.addEventListener("pointerup", () => { if(sketch) sketch._last = null; });
  addEventListener("resize", draw);
  setMode("grid");
}

// These read S and I, which are null until boot() has fetched them, and they
// are interpolated into the copy below. So they must be FUNCTIONS evaluated
// when a mode is entered, not constants evaluated when the script loads --
// an earlier version built the copy at load time and referenced one of them
// before its own declaration, which threw a ReferenceError and left the page
// stuck on "loading" with nothing in the console but that one line.
// how well each parameter is recovered, out of sample on the 2401-case grid
const R2OF = k => IF ? IF.skill.grid[k].toFixed(2) : "-";
const ERRCM = () => S ? (S.skill.surface_rmse_m*100).toFixed(1) : "-";
// R^2 = 1 - (RMSE/RMSE_baseline)^2, the baseline being the mean deposit.
// This is the figure the paper leads with: the deposit's own thickness
// varies thirteenfold across the design, so a centimetre is not a fixed
// amount of error and the dimensionless score is the comparable one.
const BASECM = () => S ? (S.skill.surface_baseline_m*100).toFixed(1) : "-";
const ERRR2 = () => S ? (1 - Math.pow(S.skill.surface_rmse_m
                         / S.skill.surface_baseline_m, 2)).toFixed(2) : "-";
const TOEPCT = () => S ? (S.x_min_tail.toe_fraction*100).toFixed(1) : "-";

const MODETEXT = () => ({
  grid:
    "2401 LS-DYNA simulations: every combination of seven levels of each "
    + "parameter. <b>Every shape here was solved.</b>",
  pred:
    "A Gaussian process predicts the whole deposit from the four parameters, "
    + "so the sliders move continuously. <b>Nothing here was solved.</b> Held "
    + "out, it reaches <b>R&sup2; = " + ERRR2() + "</b> on the surface.",
  inv:
    "<b>Draw a deposit</b> and the four parameters that would produce it are "
    + "computed from the shape alone. Two tree ensembles do it, trained on "
    + "3420 solved simulations: friction, dilation and stiffness are read off "
    + "the shape's leading modes, cohesion off the raw profile, because "
    + "cohesion shows up as surface texture rather than as gross shape.",
});
const SLIDERNOTE = () => ({
  grid: "Arrow keys step a slider. Pin a shape to compare against.",
  pred: "Sliders are continuous; G is on a log scale.",
  inv:  "The answer is checked, not asserted: it goes back through the "
        + "forward emulator and the deposit it produces is drawn over yours. "
        + "Until you draw, an example deposit stands in.",
});

function setMode(m){
  mode = m;
  for(const k of ["grid","pred","inv"])
    $("mode-"+k).classList.toggle("active", m===k);
  $("pin").style.display = m==="grid" ? "" : "none";
  $("env").style.display = m==="inv" ? "none" : "";
  $("sketch").style.display = (m==="inv" && IF) ? "" : "none";
  $("clearsketch").style.display = (m==="inv" && sketch) ? "" : "none";
  if(m!=="grid"){ pinned=null; $("pin").classList.remove("active"); }
  // Inverse mode is about a shape, not about parameters: buildSliders puts
  // the tolerance slider where the four parameter sliders were, and drawing
  // starts switched on, because that is the only input the mode has.
  if(m==="inv"){ sketching=true; $("sketch").classList.add("active"); }
  else{ sketching=false; $("sketch").classList.remove("active"); }
  $("modetext").innerHTML = MODETEXT()[m];
  $("slidernote").innerHTML = SLIDERNOTE()[m];
  $("rohead").textContent = m==="grid" ? "This deposit"
                          : m==="pred" ? "Predicted deposit"
                          : "What the shape alone can tell you";
  $("keynote").innerHTML =
      m==="grid"
    ? '<span class="key" style="color:#c9a08a">&#9632;</span> the deposit, '
      + 'which every number above describes. '
      + '<span class="key" style="color:#bdb5a6">&#9632;</span> material on '
      + 'the chute or past the plate, excluded from every measurement.'
    : m==="pred"
    ? '<span class="key" style="color:#2a78d6">&#9632;</span> the predicted '
      + 'surface, with a band at the held-out error of ' + ERRCM() + ' cm. '
      + '<span class="key" style="color:#d8d4cc">&#9632;</span> the nearest '
      + 'solved grid cell. The back edge is drawn at the slope toe, where '
      + TOEPCT() + '% of solved runs put it.'
    : '<span class="key" style="color:#c9a08a">&#9632;</span> the shape '
      + 'being asked about. '
      + '<span class="key" style="color:#2a78d6">&#9632;</span> what the '
      + 'recovered parameters produce when they are put back through the '
      + 'forward emulator. The two should coincide; where they do not, the '
      + 'shape is outside what the model can make and the numbers mean '
      + 'little.';
  buildSliders(); draw();
}

// ---------------------------------------------------------------- sliders
function contValue(i){
  const r = S.ranges[KEYS[i].f], t = cont[i];
  return KEYS[i].log ? r[0]*Math.pow(r[1]/r[0], t) : r[0] + t*(r[1]-r[0]);
}
const disp = (i,v) => KEYS[i].log ? v/1e6 : v;      // G is stored in Pa

// Nothing to set here. In this view the parameters are the answer, not the
// input, so the panel carries the buttons and says what is going on.
function buildInvPanel(){
  $("sliders").innerHTML =
      '<p class="note" style="margin-top:0">The four parameters on the right '
    + 'are computed from the shape alone. Redraw and they change.</p>';
}

function buildSliders(){
  if(mode==="inv"){ buildInvPanel(); return; }
  $("sliders").innerHTML = KEYS.map((p,i)=>{
    let lo, hi, max, val;
    if(mode!=="pred"){
      const lv = D.levels[p.k]; lo = lv[0]; hi = lv[N-1]; max = N-1; val = sel[i];
    }else{
      const r = S.ranges[p.f];
      lo = disp(i, r[0]); hi = disp(i, r[1]); max = NSTEP;
      val = Math.round(cont[i]*NSTEP);
    }
    return '<div class="row">'
      + '<div class="lab"><span class="sym">' + p.sym
      + '<small>' + p.name + '</small></span>'
      + '<span class="val" id="v' + i + '"></span></div>'
      + '<input type="range" min="0" max="' + max + '" step="1" value="'
      + val + '" id="s' + i + '">'
      + '<div class="ticks"><span>' + fmt(lo,p) + '</span><span>'
      + fmt(hi,p) + '</span></div></div>';
  }).join("");
  KEYS.forEach((p,i)=>{
    $("s"+i).addEventListener("input", e=>{
      if(mode!=="pred") sel[i] = +e.target.value;
      else cont[i] = clamp01(+e.target.value / NSTEP);
      syncSliders(); draw();
    });
  });
  syncSliders();
}
const fmt = (v,p) => v.toFixed(p.dp) + " " + p.unit;
function syncSliders(){
  KEYS.forEach((p,i)=>{
    $("v"+i).textContent = mode!=="pred"
      ? fmt(D.levels[p.k][sel[i]], p)
      : fmt(disp(i, contValue(i)), p);
  });
}

// ---------------------------------------------------------------- emulator
// A Gaussian-process posterior mean is one dot product against the stored
// training inputs. Matern nu=3/2 with ARD length scales:
//     k(a,b) = const * (1 + sqrt(3) d) exp(-sqrt(3) d),
//     d^2    = sum_k ((a_k - b_k) / ls_k)^2
// and the prediction is  [k(x,X) . alpha] * y_std + y_mean.
const SQ3 = Math.sqrt(3);
function gpPredict(xs){
  const out = {}, n = S.n_train, F = S.n_feat;
  for(let o=0; o<S.outputs.length; o++){
    const name = S.outputs[o], m = S.models[name], off = o*n;
    const l0=m.ls[0], l1=m.ls[1], l2=m.ls[2], l3=m.ls[3];
    let acc = 0;
    for(let j=0, q=0; j<n; j++, q+=F){
      const a=(xs[0]-XT[q])/l0, b=(xs[1]-XT[q+1])/l1,
            c=(xs[2]-XT[q+2])/l2, e=(xs[3]-XT[q+3])/l3;
      const s = SQ3*Math.sqrt(a*a+b*b+c*c+e*e);
      acc += (1+s)*Math.exp(-s)*AL[off+j];
    }
    out[name] = acc*m.const*m.y_std + m.y_mean;
  }
  return out;
}

function predictDeposit(){ return predictFrom(KEYS.map((p,i)=>contValue(i))); }

// the same forward prediction for parameters that did not come from the
// sliders -- the inverse view puts its own answer back through this
function predictFrom(raw){
  const xs = raw.map((v,i)=>(v - S.feat_mean[i]) / S.feat_scale[i]);
  const o = gpPredict(xs);
  const nb = S.n_bins, z = new Float64Array(nb);
  for(let b=0;b<nb;b++){
    let v = S.pca_mean[b];
    for(let m=0;m<S.pca_components.length;m++) v += o["mode"+m]*S.pca_components[m][b];
    z[b] = v > 0 ? v : 0;
  }
  const spread = Math.max(o.spread, 1e-3);
  // Anchored at the toe, deliberately, and NOT at the emulator's own x_min.
  // x_min is bimodal: 97.8% of solved deposits start at the toe (sd 1.9 mm)
  // and ~2% detach and start anywhere out to 1.55 m, and those few carry 98%
  // of its variance. Which case detaches is not a function of the four
  // parameters -- the emulator scores R^2 < 0 on it -- so using the fitted
  // value would displace every ordinary prediction to chase a rare one it
  // cannot get right anyway.
  const xmin = 0;
  let zmax = 0; for(let b=0;b<nb;b++) if(z[b]>zmax) zmax=z[b];
  return {raw, z, xmin, spread, xmax: xmin+spread, zmax, xminFit: o.x_min};
}

// nearest cell of the solved grid, so a prediction can be eyeballed against
// a simulation the emulator was never trained on
function nearestCell(raw){
  const s = KEYS.map((p,i)=>{
    const lv = D.levels[p.k], t = disp(i, raw[i]);
    let best=0, bd=Infinity;
    for(let k=0;k<lv.length;k++){ const d=Math.abs(lv[k]-t); if(d<bd){bd=d;best=k;} }
    return best;
  });
  return {s, c: D.cases[idx(s)]};
}

// ---------------------------------------------------------------- inverse
// No model: collect every design case whose surface lies within eps of the
// query and report the spread of each parameter across them. Those are
// deposits that cannot be told apart, so whatever they disagree about is
// what the deposit does not determine.
// What a person measuring a deposit would have: the envelope on 40 bins
// between its ends, where it starts, and how long it is. A solved case
// carries all three already; a drawing has to be cut into them.
function envOfCase(c){
  const z = new Float64Array(IF.n_bins);
  for(let b=0;b<IF.n_bins;b++) z[b] = c.z[b]/1000;    // stored in mm
  return {z, xmin: c.xmin, s: c.s};
}
function envOfSketch(q){
  const nx = IF.nx, dx = IF.x_max/(nx-1);
  let i0 = -1, i1 = -1;
  for(let i=0;i<nx;i++) if(q[i] > 0.001){ if(i0 < 0) i0 = i; i1 = i; }
  if(i0 < 0 || i1 <= i0) return null;
  const xmin = i0*dx, s = (i1-i0)*dx, nb = IF.n_bins;
  const z = new Float64Array(nb);
  for(let b=0;b<nb;b++){
    const u = (xmin + s*b/(nb-1))/dx;
    const j = Math.min(nx-2, Math.floor(u)), f = u-j;
    const v = (1-f)*q[j] + f*q[j+1];
    z[b] = v > 0 ? v : 0;
  }
  return {z, xmin, s};
}
function shapeFeat(e){
  const x = new Float64Array(IF.n_modes + 2);
  for(let m=0;m<IF.n_modes;m++){
    const cm = IF.pca_components[m];
    let a = 0;
    for(let b=0;b<IF.n_bins;b++) a += (e.z[b] - IF.pca_mean[b])*cm[b];
    x[m] = a;
  }
  x[IF.n_modes] = e.xmin; x[IF.n_modes+1] = e.s;
  return x;
}
function binFeat(e){
  const x = new Float64Array(IF.n_bins + 2);
  for(let b=0;b<IF.n_bins;b++) x[b] = e.z[b];
  x[IF.n_bins] = e.xmin; x[IF.n_bins+1] = e.s;
  return x;
}

// ---- drawing a deposit by hand -----------------------------------------
// A sketch that resembles no simulation returns nothing at all, and the panel
// says so along with the distance to the closest case. That is better than
// the nearest few, which would look like an answer.
function sketchFromEvent(ev){
  const cv = $("cv"), r = cv.getBoundingClientRect();
  const W = r.width, H = r.height;
  const px = (ev.clientX - r.left), py = (ev.clientY - r.top);
  const x = AX.x0 + px / W * (AX.x1 - AX.x0);
  const z = Math.max(0, AX.z0 + (H - py) / H * (AX.z1 - AX.z0));
  const k = Math.round(x / IF.x_max * (IF.nx - 1));
  if(k < 0 || k >= IF.nx) return;
  if(!sketch){ sketch = new Float64Array(IF.nx); sketch.fill(0); sketch._last = k; }
  // join up to the previous bin so a quick drag does not leave gaps
  const prev = (sketch._last == null) ? k : sketch._last;
  const lo = Math.min(prev, k), hi = Math.max(prev, k);
  const z0 = sketch[prev];
  for(let j=lo; j<=hi; j++){
    const t = (hi === lo) ? 1 : (j - lo) / (hi - lo);
    sketch[j] = (prev <= k) ? (1-t)*z0 + t*z : (1-t)*z + t*z0;
  }
  sketch._last = k;
}

function paintSketch(g,sx,sz,q){
  g.fillStyle = "rgba(201,160,138,.35)";
  g.beginPath(); g.moveTo(sx(0), sz(0));
  for(let k=0;k<IF.nx;k++) g.lineTo(sx(k/(IF.nx-1)*IF.x_max), sz(q[k]));
  g.lineTo(sx(IF.x_max), sz(0)); g.closePath(); g.fill();
  g.strokeStyle = "#8d6a53"; g.lineWidth = 2.4; g.beginPath();
  for(let k=0;k<IF.nx;k++){
    const x = sx(k/(IF.nx-1)*IF.x_max), z = sz(q[k]);
    k ? g.lineTo(x,z) : g.moveTo(x,z);
  }
  g.stroke();
}

// One pass down each tree. The split threshold is stored as a uint16 over
// that feature's own range and unpacked here, so the walk touches only the
// nodes on its path rather than the forty thousand in the ensemble.
function forestRuns(tag, x){
  const a = IFA[tag], lo = IF[tag+"_lo"], hi = IF[tag+"_hi"], nout = a.nout;
  const runs = [];
  for(let k=0;k<a.offset.length;k++){
    const o = a.offset[k];
    let i = 0;
    while(a.feat[o+i] !== 255){
      const f = a.feat[o+i];
      const span = hi[f] > lo[f] ? hi[f] - lo[f] : 1;
      i = x[f] <= lo[f] + a.thr[o+i]/65535*span ? a.left[o+i] : a.right[o+i];
    }
    const li = a.leafBase[k] + a.left[o+i], v = [];
    for(let c=0;c<nout;c++) v.push(a.value[li*nout + c]);
    runs.push(v);
  }
  return runs;
}

const pctOf = (v,p) => {
  const t = (v.length-1)*p/100, lo = Math.floor(t), f = t-lo;
  return lo+1 < v.length ? (1-f)*v[lo] + f*v[lo+1] : v[lo];
};

// A deposit in, four parameters out. Every tree is one estimate: the median
// of the sixty is the answer, and their 5th-95th percentile is how much they
// disagree, which is the only uncertainty this estimator can honestly report.
// It is the estimator's own spread, not a posterior.
function invert(e){
  const rs = forestRuns("shape", shapeFeat(e));
  const rc = forestRuns("coh", binFeat(e));
  const col = (runs,k) => runs.map(v=>v[k]).sort((a,b)=>a-b);
  const raw = {
    gmod_pa: col(rs,0).map(v=>Math.pow(10,v)),   // trained on log10 G
    phi_rad: col(rs,1),
    psi_rad: col(rs,2),
    cval_pa: col(rc,0),
  };
  const stats = IF.params.map(name => {
    const v = raw[name];
    return {name, mid: pctOf(v,50), lo: pctOf(v,5), hi: pctOf(v,95)};
  });
  return {stats, env: e};
}

// A value's place on its parameter's sampled range, 0 to 1. G is placed on
// a log axis because that is how it was sampled; on a linear one the whole
// lower half of the range would be squeezed into a few pixels.
function posOf(j, v){
  const p = KEYS[j], r = IF.ranges[p.f];
  return p.log
    ? clamp01((Math.log10(v) - Math.log10(r[0]))
              / (Math.log10(r[1]) - Math.log10(r[0])))
    : clamp01((v - r[0]) / (r[1] - r[0]));
}
// the value that really produced the query, when there is one. A drawing has
// no true answer, so there is nothing to mark.
function truePos(j){
  if(sketch) return null;
  const p = KEYS[j], v = D.levels[p.k][sel[j]];
  return posOf(j, p.log ? v*1e6 : v);
}

// ---------------------------------------------------------------- drawing
function draw(){
  const cv = $("cv"), dpr = devicePixelRatio || 1;
  const W = cv.clientWidth, H = W*(AX.z1-AX.z0)/(AX.x1-AX.x0);   // 1:1 aspect
  cv.width = W*dpr; cv.height = H*dpr; cv.style.height = H+"px";
  const g = cv.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,W,H);

  const sx = x => (x-AX.x0)/(AX.x1-AX.x0)*W;
  const sz = z => H - (z-AX.z0)/(AX.z1-AX.z0)*H;

  g.strokeStyle="#ebe8e0"; g.lineWidth=1;
  for(let x=0; x<=2.0; x+=0.25){
    g.beginPath(); g.moveTo(sx(x),0); g.lineTo(sx(x),H); g.stroke(); }
  for(let z=0; z<=0.4; z+=0.1){
    g.beginPath(); g.moveTo(0,sz(z)); g.lineTo(W,sz(z)); g.stroke(); }

  let pred = null, near = null, inv = null;
  if(mode==="grid"){
    if(pinned) paint(g,sx,sz,D.cases[idx(pinned)],"#d7d3ca","#b9b5ab","#e3e0d8",false);
    paint(g,sx,sz,D.cases[idx(sel)],"#c9a08a","#1b3a6b","#bdb5a6",showEnv);
  }else if(mode==="pred"){
    pred = predictDeposit();
    near = nearestCell(pred.raw);
    paint(g,sx,sz,near.c,"#e2ded6","#d8d4cc","#eae7e0",false);
    paintPrediction(g,sx,sz,pred);
  }else{
    const env = sketch ? envOfSketch(sketch) : envOfCase(D.cases[idx(sel)]);
    inv = env ? invert(env) : null;
    // The check. The recovered parameters go back through the forward
    // emulator and what they produce is drawn over what was asked about; if
    // the two do not coincide, the answer is not to be believed.
    if(inv && S){
      inv.check = predictFrom(inv.stats.map(s=>s.mid));
      paintPrediction(g,sx,sz,inv.check);
    }
    if(sketch) paintSketch(g,sx,sz,sketch);
    else paint(g,sx,sz,D.cases[idx(sel)],"#c9a08a","#1b3a6b","#bdb5a6",true);
  }

  // the chute and the floor plate: two separate structures, never joined,
  // because the chute's toe and the start of the plate do not meet
  g.strokeStyle="#898781"; g.lineWidth=2; g.lineCap="round";
  for(const seg of [D.geometry.slide, D.geometry.floor]){
    g.beginPath(); g.moveTo(sx(seg[0][0]), sz(seg[0][1]));
    for(let i=1;i<seg.length;i++) g.lineTo(sx(seg[i][0]), sz(seg[i][1]));
    g.stroke();
  }
  g.strokeStyle="#a3231b"; g.lineWidth=1.5; g.setLineDash([5,4]);
  g.beginPath(); g.moveTo(sx(D.geometry.domain_x[1]),0);
  g.lineTo(sx(D.geometry.domain_x[1]),H); g.stroke(); g.setLineDash([]);
  g.fillStyle="#a3231b"; g.font="11px system-ui";
  g.fillText("end of plate", sx(D.geometry.domain_x[1])-74, 14);

  if(mode==="grid") readoutGrid(D.cases[idx(sel)]);
  else if(mode==="pred") readoutPred(pred, near);
  else readoutInv(inv);
}

function paint(g,sx,sz,c,dot,line,context,env){
  if(!c) return;
  // Particles are stored deposit-first: the leading `pin` lie inside the
  // analysis domain and the rest is chute or past-plate material. Membership
  // is decided at export time on the unrounded coordinates, because rounding
  // to the millimetre moves particles across the boundary and anything
  // re-deriving it here would disagree with the measurements.
  if(c.pn){
    const dots = (from,to,fill) => {
      g.fillStyle = fill;
      for(let i=from;i<to;i++){
        const o = (c.po+i)*2;
        g.fillRect(sx(P[o]/1000)-1.1, sz(P[o+1]/1000)-1.1, 2.2, 2.2);
      }
    };
    dots(c.pin, c.pn, context);   // context, behind
    dots(0, c.pin, dot);          // the deposit the numbers describe
  }
  if(env){
    g.strokeStyle=line; g.lineWidth=1.8; g.beginPath();
    for(let i=0;i<c.z.length;i++){
      const x = sx(c.xmin + i/(c.z.length-1)*c.s), z = sz(c.z[i]/1000);
      i ? g.lineTo(x,z) : g.moveTo(x,z);
    }
    g.stroke();
  }
}

function paintPrediction(g,sx,sz,p){
  const n = p.z.length, e = S.skill.surface_rmse_m;
  const px = i => sx(p.xmin + i/(n-1)*p.spread);
  // the band is the emulator's held-out surface error, not a GP posterior
  // interval: the posterior sd needs the Cholesky factor of a 3420x3420
  // matrix, and it would measure interpolation rather than model error
  g.fillStyle = "rgba(42,120,214,.13)";
  g.beginPath();
  for(let i=0;i<n;i++){ const x=px(i), z=sz(p.z[i]+e); i?g.lineTo(x,z):g.moveTo(x,z); }
  for(let i=n-1;i>=0;i--){ g.lineTo(px(i), sz(Math.max(p.z[i]-e,0))); }
  g.closePath(); g.fill();

  g.fillStyle = "rgba(42,120,214,.10)";
  g.beginPath(); g.moveTo(px(0), sz(0));
  for(let i=0;i<n;i++) g.lineTo(px(i), sz(p.z[i]));
  g.lineTo(px(n-1), sz(0)); g.closePath(); g.fill();

  g.strokeStyle = "#2a78d6"; g.lineWidth = 2; g.setLineDash([6,3]);
  g.beginPath();
  for(let i=0;i<n;i++){ const x=px(i), z=sz(p.z[i]); i?g.lineTo(x,z):g.moveTo(x,z); }
  g.stroke(); g.setLineDash([]);
}

// ---------------------------------------------------------------- readout
const cell = (a,b) => "<tr><td>"+a+"</td><td>"+b+"</td></tr>";
function readoutGrid(c){
  if(!c) return;
  $("ro").innerHTML =
      cell("Runout <small>x<sub>max</sub></small>", c.xmax.toFixed(3)+" m")
    + cell("Peak thickness <small>z<sub>max</sub></small>", (c.zmax*100).toFixed(1)+" cm")
    + cell("Footprint <small>s</small>", c.s.toFixed(3)+" m")
    + cell("Particles in deposit", c.pin!=null ? c.pin : "-")
    + cell("Shown but not measured", (c.pn!=null&&c.pin!=null) ? (c.pn-c.pin) : "-")
    + cell("Left on the chute", (c.retained*100).toFixed(1)+" %");
  const f = $("flag");
  f.className = "flag" + (c.censored ? " on" : "");
  if(c.censored) f.innerHTML = "<b>Runout is a lower bound here.</b> "
    + (c.ranoff*100).toFixed(1) + "% of this material passed the end of the "
    + "modelled plate at 1.99 m. Beyond that there is no floor, so it falls "
    + "freely and is excluded from the measurements: its front position is "
    + "set by how long it has been falling, not by the parameters.";
}

function readoutPred(p, near){
  if(!p) return;
  const c = near.c;
  const row = (a,pv,nv) => "<tr><td>"+a+"</td><td class='cmp'>"+nv+"</td><td>"+pv+"</td></tr>";
  $("ro").innerHTML =
      "<tr><td></td><td class='cmp'>nearest solved</td><td>predicted</td></tr>"
    + row("Runout <small>x<sub>max</sub></small>",
          p.xmax.toFixed(3)+" m", c ? c.xmax.toFixed(3)+" m" : "-")
    + row("Peak thickness <small>z<sub>max</sub></small>",
          (p.zmax*100).toFixed(1)+" cm", c ? (c.zmax*100).toFixed(1)+" cm" : "-")
    + row("Footprint <small>s</small>",
          p.spread.toFixed(3)+" m", c ? c.s.toFixed(3)+" m" : "-");
  const f = $("flag");
  const detached = c && c.xmin > 0.05;
  const far = c && !detached && Math.abs(p.xmax - c.xmax) > 0.20;
  f.className = "flag" + ((c && c.censored) || detached || far ? " on" : "");
  let msg = "";
  if(c && c.censored) msg += "<b>The nearest solved cell is censored:</b> "
    + (c.ranoff*100).toFixed(1) + "% of its material passed the end of the "
    + "plate, so its runout is a lower bound and the comparison above is not "
    + "like for like. ";
  if(detached) msg += "<b>The nearest solved cell is a detached deposit</b> "
    + "&mdash; its back edge is at " + (c.xmin*100).toFixed(0) + " cm, not at "
    + "the toe. This is the case the emulator cannot predict, so the two "
    + "shapes are not comparable here. ";
  if(far) msg += "Prediction and nearest solved cell differ by more than "
    + "20 cm in runout. The grid cell can be up to half a level away in every "
    + "parameter, so some of that is real difference and not emulator error.";
  f.innerHTML = msg;
}

function readoutInv(inv){
  const f = $("flag");
  if(!inv){
    $("ro").innerHTML = '<tr><td class="leg" colspan="3">Draw a deposit on '
      + 'the canvas.</td></tr>';
    f.className = "flag"; return;
  }
  const row = (j,s) => {
    const p = KEYS[j];
    const shown = p.log ? s.mid/1e6 : s.mid;
    const a = posOf(j, s.lo), b = posOf(j, s.hi), tp = truePos(j);
    return '<tr><td class="par"><span class="sym">' + p.sym
      + '<small>' + p.short + '</small></span></td>'
      + '<td class="cmp">' + shown.toFixed(p.dp) + ' ' + p.unit + '</td>'
      + '<td><div class="track">'
      +   '<div class="span" style="left:' + (a*100) + '%;width:'
      +     (Math.max(b-a, 0.004)*100) + '%"></div>'
      +   '<div class="tick mid" style="left:' + (posOf(j, s.mid)*100) + '%"></div>'
      +   (tp === null ? ''
          : '<div class="tick tru" style="left:' + (tp*100) + '%"></div>')
      + '</div></td></tr>';
  };
  $("ro").innerHTML =
      '<tr><td></td><td class="cmp">estimate</td><td>across 60 trees</td></tr>'
    + inv.stats.map((s,j)=>row(j,s)).join("")
    + '<tr><td class="leg" colspan="3">The band is where the middle 90 per '
    + 'cent of the sixty trees put it and the line inside is their median, so '
    + 'it is how much the estimator disagrees with itself, not how much the '
    + 'deposit constrains the parameter'
    + (sketch ? '.' : '; the dark line is the value that really produced this '
                    + 'deposit.')
    + '</td></tr>';

  // how well the answer reproduces the shape it came from
  let msg = "";
  if(inv.check){
    const e = inv.env, nb = IF.n_bins;
    let ss = 0;
    for(let b=0;b<nb;b++){
      const d = inv.check.z[b] - e.z[b]; ss += d*d;
    }
    const rms = Math.sqrt(ss/nb);
    msg = "<b>Put back through the emulator, these parameters produce the "
      + "blue deposit</b> &mdash; " + (rms*100).toFixed(1) + " cm from the "
      + (sketch ? "shape you drew" : "one asked about") + ", against the "
      + ERRCM() + " cm the emulator is wrong by anyway. ";
    msg += rms > 2.5*S.skill.surface_rmse_m
      ? "That is well outside its own error, so this shape is not one the "
        + "model can make and the numbers above mean little."
      : "Within its own error, so the answer is at least self-consistent.";
  }
  f.className = "flag on";
  f.innerHTML = msg
    + " Across the 2401 solved deposits this estimator has never seen, it "
    + "recovers <b>friction at R&sup2; = " + R2OF("phi_rad") + " and stiffness "
    + "at " + R2OF("gmod_log10") + "</b> &mdash; which is the result this page "
    + "is about: a deposit records what the material's friction was, and "
    + "little about how stiff it was.";
}

boot();
</script>
</body>
</html>
